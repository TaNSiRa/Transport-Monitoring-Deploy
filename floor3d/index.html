<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 3D delivery floor shown on the dashboard TV. Flutter embeds this page and posts live numbers into it (see lib/dashboard/floor3d_web.dart; scene shared with SOI8-DEL-FINAL-INSPEC-FRONT). -->
<title>TP Delivery Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Everything this page needs is bundled here, so the TV works without internet. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: live isometric 3D yard fills the TV; glass HUD on top, five big station cards along the bottom */
:root{
  --world:#E8EEF5; --glass:rgba(255,255,255,.95); --glass-line:rgba(15,27,45,.08);
  --ink:#0F1B2D; --muted:#56667B; --blue:#2F6BFF; --blue-soft:#E6EEFF;
  --fin:#1FA85A; --fin-ink:#14773F; --fin-soft:#E3F5EB;
  --inp:#F5A524; --inp-ink:#9A5B06; --inp-soft:#FDF1DC;
  --wait:#94A3B8; --wait-ink:#475569; --wait-soft:#EEF2F6;
  --sans:'Plus Jakarta Sans','IBM Plex Sans Thai',system-ui,sans-serif;
  --thai:'IBM Plex Sans Thai','Plus Jakarta Sans',system-ui,sans-serif;
  --gut:max(clamp(16px,1.7vw,34px),env(safe-area-inset-left,0px));
  --gutr:max(clamp(16px,1.7vw,34px),env(safe-area-inset-right,0px));
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--world);color:var(--ink);font-family:var(--sans);overflow:hidden}
.app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.nogl{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:var(--muted)}

.hud{position:absolute;left:0;right:0;top:0;padding-top:clamp(12px,1.4vw,28px);padding-left:var(--gut);padding-right:var(--gutr);display:flex;flex-wrap:wrap;gap:clamp(10px,1vw,18px);align-items:flex-start;justify-content:space-between;pointer-events:none}
.hud>*{pointer-events:auto}
.panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:clamp(14px,1.1vw,22px);box-shadow:0 10px 30px rgba(31,55,90,.10)}
.brand{display:flex;align-items:center;gap:14px;padding:clamp(10px,.9vw,16px) clamp(14px,1.2vw,22px)}
.logo{width:clamp(36px,2.6vw,50px);height:clamp(36px,2.6vw,50px);border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(14px,1vw,19px);letter-spacing:.02em}
.brand small{display:block;font-size:clamp(11px,.72vw,14px);font-weight:700;letter-spacing:.18em;color:var(--muted)}
.brand h1{margin:2px 0 0;font-size:clamp(18px,1.6vw,32px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.kpis{display:flex;flex-wrap:wrap;gap:clamp(8px,.7vw,12px)}
.kpi{display:flex;align-items:center;gap:10px;padding:clamp(8px,.7vw,13px) clamp(12px,1vw,18px)}
.kpi b{font-size:clamp(18px,1.5vw,30px);font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:clamp(12px,.82vw,16px);color:var(--muted);font-weight:600;line-height:1.2}
.kpi i{width:10px;height:10px;border-radius:50%;flex:none}
.right{display:flex;flex-wrap:wrap;gap:clamp(8px,.7vw,12px);align-items:stretch;justify-content:flex-end;margin-left:auto}
.clock{display:flex;align-items:center;gap:12px;padding:clamp(8px,.7vw,13px) clamp(14px,1.1vw,20px)}
.clock .t{font-size:clamp(20px,1.9vw,38px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .d{font-size:clamp(12px,.82vw,16px);color:var(--muted);font-weight:600}
.live{position:relative;width:10px;height:10px;border-radius:50%;background:var(--fin)}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fin);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.55}to{transform:scale(3.4);opacity:0}}
.ring{width:34px;height:34px}
.ring circle.p{stroke-dasharray:88;animation:cd 10s linear infinite}
@keyframes cd{from{stroke-dashoffset:88}to{stroke-dashoffset:0}}
.seg{display:flex;padding:4px;gap:4px}
.seg button{font:inherit;font-size:clamp(13px,.85vw,16px);font-weight:700;border:0;border-radius:10px;padding:0 14px;min-height:40px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* switch to the dashboard's card pipeline — only offered when embedded */
.cardsBtn{display:none;align-items:center;gap:8px;font:inherit;font-size:clamp(13px,.85vw,16px);font-weight:700;border:0;border-radius:14px;padding:0 16px;min-height:48px;background:#fff;color:var(--ink);cursor:pointer}
.embed .cardsBtn{display:inline-flex}
.cardsBtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cardsBtn svg{width:18px;height:18px}

#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform;transition:opacity .3s}
.pin .bub{position:relative;width:clamp(48px,3.6vw,70px);height:clamp(48px,3.6vw,70px);border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);box-shadow:0 8px 18px rgba(47,107,255,.35);display:grid;place-items:center}
.pin .bub span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:clamp(14px,1.05vw,21px);font-variant-numeric:tabular-nums}
.pin.hold .bub{background:#F59E0B;box-shadow:0 8px 18px rgba(245,158,11,.4)}
.pin .lab{background:var(--glass);border:1px solid var(--glass-line);border-radius:99px;padding:5px 12px;font-size:clamp(12px,.8vw,16px);font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(31,55,90,.10)}
.pin .bub::after{content:"";position:absolute;inset:-6px;border-radius:50% 50% 50% 0;border:2px solid currentColor;color:rgba(47,107,255,.45);animation:halo 2.2s ease-out infinite}
.pin.hold .bub::after{color:rgba(245,158,11,.5)}
@keyframes halo{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
.pin.focus .bub{transform:rotate(-45deg) scale(1.2)}

.cards{position:absolute;left:0;right:0;bottom:0;padding-bottom:clamp(14px,1.4vw,28px);padding-left:var(--gut);padding-right:var(--gutr);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1vw,20px);align-items:stretch;transition:grid-template-columns .9s cubic-bezier(.2,.8,.2,1)}
.app[data-mode="tour"] .cards{align-items:end}
.card{position:relative;padding:clamp(14px,1.25vw,26px);display:flex;flex-direction:column;gap:clamp(8px,.7vw,14px);min-width:0;cursor:pointer;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.card.focus{box-shadow:0 0 0 3px var(--blue),0 18px 40px rgba(31,55,90,.18)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:clamp(12px,.85vw,17px);font-weight:800;letter-spacing:.12em;color:var(--blue)}
.state{font-size:clamp(11px,.75vw,15px);font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.state.inp{background:var(--inp-soft);color:var(--inp-ink)}
.state.fin{background:var(--fin-soft);color:var(--fin-ink)}
.state.wait{background:var(--wait-soft);color:var(--wait-ink)}
.c-name{margin:0;font-size:clamp(18px,1.55vw,32px);font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-th{margin:0;font-family:var(--thai);font-size:clamp(13px,.9vw,18px);color:var(--muted);line-height:1.4;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-pct{display:flex;align-items:flex-end;gap:4px}
.pv{font-size:clamp(48px,5.6vw,112px);font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ps{font-size:clamp(20px,2vw,40px);font-weight:800;color:var(--muted);line-height:1.2}
.pl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:clamp(11px,.72vw,14px);font-weight:700;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.pl .of{letter-spacing:0;font-weight:600}
.bar{display:flex;height:clamp(10px,.85vw,16px);border-radius:99px;background:#E3E9F0;overflow:hidden}
.bar i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1);transform-origin:left center;animation:grow 1.5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .3s)}
.bar .bf{background:var(--fin)}
.bar .bi{position:relative;overflow:hidden;background-color:var(--inp)}
.bar .bi::after{content:"";position:absolute;top:0;bottom:0;left:-17px;right:0;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:slide .9s linear infinite;will-change:transform}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes slide{to{transform:translateX(17px)}}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,.5vw,10px)}
.cnt{border-radius:clamp(10px,.8vw,16px);padding:clamp(8px,.65vw,13px) clamp(10px,.8vw,16px);display:flex;flex-direction:column;gap:4px;min-width:0}
.cnt .cl{font-size:clamp(11px,.78vw,15px);font-weight:700;white-space:nowrap}
.cnt .cv{font-size:clamp(24px,2.3vw,46px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cnt.fin{background:var(--fin-soft)}.cnt.fin .cl{color:var(--fin-ink)}
.cnt.inp{background:var(--inp-soft)}.cnt.inp .cl{color:var(--inp-ink)}
.cnt.wait{background:var(--wait-soft)}.cnt.wait .cl{color:var(--wait-ink)}
.note{margin:auto 0 0;font-size:clamp(12px,.85vw,17px);font-weight:600;border-radius:10px;padding:8px 10px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;box-sizing:content-box}
.note.hold{background:var(--inp-soft);color:var(--inp-ink)}
.note.info{background:var(--blue-soft);color:#1E46B8}
.note.none{background:var(--wait-soft);color:var(--wait-ink)}

.app[data-mode="tour"] .card :is(.c-th,.counts,.note){display:none}
.app[data-mode="tour"] .card .pv{font-size:clamp(34px,3.2vw,64px)}
.app[data-mode="tour"] .card{gap:clamp(6px,.5vw,10px)}

.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(15,27,45,0) 50%,rgba(15,27,45,.28));opacity:0;transition:opacity .8s}
.app[data-mode="tour"] .vig{opacity:1}
.tourTitle{position:absolute;left:var(--gut);top:clamp(96px,7.2vw,150px);display:flex;flex-direction:column;gap:4px;padding:clamp(14px,1.2vw,24px) clamp(16px,1.4vw,28px);pointer-events:none;opacity:0;transform:translateX(-20px);transition:opacity .5s,transform .5s}
.app[data-mode="tour"] .tourTitle{opacity:1;transform:none}
.tt-step{font-weight:800;letter-spacing:.16em;color:var(--blue);font-size:clamp(14px,1.05vw,21px)}
.tt-name{font-weight:800;font-size:clamp(28px,2.5vw,50px);line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.tt-th{font-family:var(--thai);font-size:clamp(14px,1.05vw,21px);color:var(--muted)}
.tourTitle{max-width:clamp(300px,26vw,500px)}
.tt-stats{display:flex;align-items:flex-end;gap:clamp(12px,1vw,20px);margin-top:10px}
.tt-pct{font-weight:800;font-size:clamp(48px,4.6vw,92px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tt-pct small{font-size:.42em;color:var(--muted);letter-spacing:0}
.tt-cnt{display:flex;gap:8px}
.tt-cnt span{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:8px 12px;font-size:clamp(12px,.8vw,15px);font-weight:700;white-space:nowrap}
.tt-cnt b{font-size:clamp(22px,1.9vw,38px);font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tt-cnt .f{background:var(--fin-soft);color:var(--fin-ink)}.tt-cnt .i{background:var(--inp-soft);color:var(--inp-ink)}
.tt-note{display:block;margin-top:8px;font-size:clamp(12px,.85vw,16px);font-weight:600;border-radius:10px;padding:8px 10px}
.tt-note.hold{background:var(--inp-soft);color:var(--inp-ink)}.tt-note.info{background:var(--blue-soft);color:#1E46B8}.tt-note.none{background:var(--wait-soft);color:var(--wait-ink)}
.tt-bar{display:block;height:5px;width:clamp(160px,14vw,280px);background:#E3E9F0;border-radius:5px;overflow:hidden;margin-top:8px}
.tt-bar i{display:block;height:100%;background:var(--blue);transform-origin:left center}
.tourTitle.go .tt-bar i{animation:dwell var(--dwell,6s) linear both}
@keyframes dwell{from{transform:scaleX(0)}}
.tourTitle.go>span:not(.tt-bar){animation:ttin .75s cubic-bezier(.2,.8,.2,1) both}
.tourTitle.go>.tt-name{animation-delay:.08s}.tourTitle.go>.tt-th{animation-delay:.16s}
@keyframes ttin{from{opacity:0;transform:translateX(-28px)}}
/* tour panel: fills the left column from the header down to the cards, % in the middle */
.tourTitle{bottom:240px;width:clamp(300px,25vw,500px);max-width:none;box-sizing:border-box;border-top:7px solid var(--blue);box-shadow:0 18px 44px rgba(31,55,90,.22);gap:6px}
.tourTitle::before{content:"";position:absolute;inset:-4px;border-radius:inherit;border:4px solid var(--blue);opacity:0;pointer-events:none}
.tourTitle.go::before{animation:ttpulse 1.3s ease-out}
@keyframes ttpulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.tt-now{display:flex;align-items:center;gap:8px;font-size:clamp(11px,.72vw,14px);font-weight:800;letter-spacing:.2em;color:var(--muted)}
.tt-now i{position:relative;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.tt-now i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--blue);animation:ping 1.6s ease-out infinite}
.tt-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;padding:8px 0}
.tt-pct{font-weight:800;font-size:clamp(80px,7.6vw,156px);line-height:.88;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.tt-pct small{font-size:.38em;color:var(--muted);letter-spacing:0;margin-left:4px}
.tt-fin{font-size:clamp(12px,.8vw,15px);font-weight:800;letter-spacing:.22em;color:var(--muted)}
.tt-pbar{display:flex;width:100%;height:clamp(12px,.9vw,18px);border-radius:99px;background:#E3E9F0;overflow:hidden;margin-top:6px}
.tt-pbar i{display:block;height:100%;transform-origin:left center}
.tt-pbar .f{background:var(--fin)}.tt-pbar .p{background:var(--inp)}
/* in-process part moves like the station cards below (.bar .bi) */
.tt-pbar .p{position:relative;overflow:hidden}
.tt-pbar .p::after{content:"";position:absolute;top:0;bottom:0;left:-17px;right:0;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:slide .9s linear infinite;will-change:transform}
.tourTitle.go .tt-pbar i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.tt-cnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tt-cnt span{display:flex;flex-direction:column;gap:4px;border-radius:16px;padding:clamp(10px,.8vw,16px) clamp(12px,1vw,18px);font-size:clamp(13px,.9vw,17px);font-weight:700}
.tt-cnt b{font-size:clamp(32px,3vw,60px);font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tourTitle.go .tt-center,.tourTitle.go .tt-cnt,.tourTitle.go .tt-note{animation:ttin .75s cubic-bezier(.2,.8,.2,1) both}
.tourTitle.go .tt-center{animation-delay:.12s}.tourTitle.go .tt-cnt{animation-delay:.2s}.tourTitle.go .tt-note{animation-delay:.26s}
@media (max-width:900px){.tourTitle{display:none}}
/* The card is pinned between the header and the station cards, so its height is
   whatever the screen leaves over. Sizes that only follow screen width overflow on
   wide, short screens (a 1920x920 fullscreen TV): the big % then runs over the
   name and "FINISHED". Size the tall items by the card's own height too (cqh). */
.tourTitle{container-type:size}
.tt-name{font-size:clamp(22px,min(2.5vw,7cqh),50px)}
.tt-pct{font-size:clamp(44px,min(7.6vw,19cqh),156px)}
.tt-cnt b{font-size:clamp(22px,min(3vw,7.5cqh),60px)}
.tt-cnt span{padding:clamp(8px,min(.8vw,1.8cqh),16px) clamp(12px,1vw,18px)}
.tt-center{overflow:hidden}
@container (max-height:430px){.tt-note{display:none}.tt-center{gap:2px;padding:4px 0}}
@container (max-height:340px){.tt-th{display:none}}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;overflow:visible;display:flex;flex-direction:column}
  #stage{position:relative;height:58vh;min-height:320px}
  .hud{position:relative;order:-1;padding-bottom:12px}
  .cards{position:relative;grid-template-columns:minmax(0,1fr)!important;padding-top:14px}
  .app[data-mode="tour"] .card :is(.c-th,.counts,.note){display:flex}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" data-mode="tour">
  <div id="stage" role="img" aria-label="3D view of the TP delivery floor: picking, invoice, final inspection, customer pick-up and truck delivery"><div id="pins" aria-hidden="true"></div></div>

  <div class="vig" aria-hidden="true"></div>
  <div class="panel tourTitle" id="tourTitle" aria-live="polite"><span class="tt-now"><i></i>NOW SHOWING</span><span class="tt-step"></span><span class="tt-name"></span><span class="tt-th"></span><span class="tt-center"><span class="tt-pct"></span><span class="tt-fin">FINISHED</span><span class="tt-pbar"><i class="f"></i><i class="p"></i></span></span><span class="tt-cnt"></span><span class="tt-note"></span><span class="tt-bar"><i></i></span></div>
  <header class="hud">
    <div class="panel brand">
      <div class="logo">TP</div>
      <div><small>TRANSPORT MONITORING</small><h1>Delivery floor today</h1></div>
    </div>
    <div class="right">
      <button type="button" class="panel cardsBtn" id="mCards" title="สลับเป็นมุมมองการ์ด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>มุมมองการ์ด</button>
      <div class="panel seg" role="group" aria-label="View">
        <button type="button" id="mOverview" aria-pressed="false">Overview</button>
        <button type="button" id="mTour" aria-pressed="true">Station tour</button>
      </div>
      <div class="panel clock">
        <span class="live" aria-hidden="true"></span>
        <div><div class="t" id="time">--:--:--</div><div class="d" id="date"></div></div>
        <svg class="ring" viewBox="0 0 34 34" aria-label="Auto refresh every 10 seconds" role="img"><circle cx="17" cy="17" r="14" fill="none" stroke="#E3E9F0" stroke-width="3"/><circle class="p" cx="17" cy="17" r="14" fill="none" stroke="#2F6BFF" stroke-width="3" stroke-linecap="round" transform="rotate(-90 17 17)"/></svg>
      </div>
    </div>
  </header>

  <section class="cards" id="cards" aria-label="Pipeline steps"></section>
</div>

<script src="vendor/three.r128.min.js"></script>
<script>
(function(){
'use strict';
/* Station names and descriptions are fixed here; when the page is embedded in the
   Flutter dashboard, the numbers and notes arrive from the backend via postMessage. */
var STEPS=[
  {key:'step1',label:'STEP 1',name:'Picking',th:'จัดของขึ้นพาเลท เตรียมส่งออก',unit:'qty',total:100,fin:50,inp:3,wait:47,note:'',tone:''},
  {key:'step2',label:'STEP 2',name:'Create invoice',th:'ออกใบ Invoice แนบไปกับสินค้า',unit:'qty',total:100,fin:80,inp:1,wait:19,note:'1 doc on hold · 811025769 TOYOTA',tone:'hold'},
